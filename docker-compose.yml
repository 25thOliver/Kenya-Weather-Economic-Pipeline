services:

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile

    container_name: kenya_pipeline_ingestion

    restart: "no"

    volumes:
      - ./data:/app/data

    depends_on:
      - minio

    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: raw-data


  minio:
    image: minio/minio:latest

    container_name: kenya_pipeline_minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data


  postgres:
    image: postgres:16

    container_name: kenya_pipeline_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: kenya_intelligence
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  minio_data: