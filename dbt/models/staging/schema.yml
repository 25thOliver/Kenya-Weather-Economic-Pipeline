version: 2

models:

  - name: stg_economic_indicators
    description: >
      Clean staging model for World Bank economic indicators.
      One row per country, indicator, and year.

    columns:
      - name: country_code
        description: ISO3 country code.
        tests:
          - not_null
          - accepted_values:
              values:
                - KEN

      - name: indicator_code
        description: World Bank indicator code.
        tests:
          - not_null
          - accepted_values:
              values:
                - NY.GDP.MKTP.CD
                - NY.GDP.MKTP.KD.ZG
                - SP.POP.TOTL
                - FP.CPI.TOTL
                - SL.UEM.TOTL.ZS
                - NV.AGR.TOTL.ZS
                - EG.ELC.ACCS.ZS
                - IT.NET.USER.ZS

      - name: year
        description: Calendar year of the observation.
        tests:
          - not_null

      - name: year_date
        description: First day of the year, as a DATE type for time-series charting.
        tests:
          - not_null

      - name: value
        description: Indicator value (unit varies by indicator).


  - name: stg_daily_weather
    description: >
      Daily weather staging model aggregated from Open-Meteo hourly data.
      One row per city per calendar day.

    columns:
      - name: date
        description: Calendar date of the observation.
        tests:
          - not_null

      - name: location
        description: City name.
        tests:
          - not_null

      - name: temperature_avg
        description: Average daily temperature in °C.
        tests:
          - not_null

      - name: temperature_min
        description: Minimum hourly temperature for the day in °C.

      - name: temperature_max
        description: Maximum hourly temperature for the day in °C.

      - name: rainfall
        description: Total daily precipitation in mm.
        tests:
          - not_null

      - name: humidity_avg
        description: Average daily relative humidity in %.
        tests:
          - not_null

      - name: wind_speed_avg
        description: Average daily wind speed in km/h.
        tests:
          - not_null
